name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs on every event, before anything else: a release must be tagged v<version>, and a
      # manual run must be started on that tag, not on a branch
      - name: Verify release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          case "$EVENT_NAME" in
            release)
              if [ "$RELEASE_TAG" != "$VERSION" ]; then
                echo "::error::Release tag $RELEASE_TAG does not match package.json version $VERSION"
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "$GIT_REF" != "refs/tags/$VERSION" ]; then
                echo "::error::A manual publish must run on the tag refs/tags/$VERSION, not $GIT_REF"
                exit 1
              fi
              ;;
            *)
              echo "::error::Publishing is not allowed on a $EVENT_NAME event"
              exit 1
              ;;
          esac

      - uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check package (publint, are-the-types-wrong)
        run: bun run check:package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: npm exchanges the workflow's OIDC token for a short-lived publish
    # credential, so there is no NPM_TOKEN, and provenance is attached automatically
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Clear committed dist before downloading the built one
        run: rm -rf dist

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Node 24 bundles npm 11, which trusted publishing needs (11.5.1 or newer)
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Require npm 11.5.1 or newer
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
