name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target other feature branches
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run Biome
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: bun run test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/croppie.js || exit 1
          test -f dist/croppie.css || exit 1
          echo "Build artifacts verified"

      # pages.yml builds the demo on main; building it here fails a PR before it breaks the deploy
      - name: Build demo bundle
        run: bun run build:docs

      - name: Check package (publint, are-the-types-wrong)
        run: bun run check:package

      # The publish job runs npm 11 on Node 24; a dry run catches a bad manifest or file list
      # before a release does. It needs no credentials. A publish dry run asks the registry,
      # which rejects a version that is already published, so it only fits an unpublished
      # version (such as a release PR); otherwise `npm pack --dry-run` lists the same tarball.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Dry-run npm publish
        run: |
          SPEC="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if [ -n "$(npm view "$SPEC" version 2>/dev/null)" ]; then
            echo "$SPEC is already on npm: checking the tarball with npm pack"
            npm pack --dry-run --ignore-scripts
          else
            npm publish --dry-run --ignore-scripts
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  size:
    name: Bundle size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Builds the base branch and the PR, then comments the gzip size difference. The action
      # detects bun.lock and runs `bun install --frozen-lockfile` and `bun run build`.
      - uses: preactjs/compressed-size-action@v2
        with:
          pattern: 'dist/croppie.{js,css}'
