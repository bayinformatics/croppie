name: Pages

# Deploys the demo in docs/ to https://bayinformatics.github.io/croppie/. The bundle
# (docs/croppie.js, .js.map, .css) is built here, not committed. The repository's Pages
# source has to be "GitHub Actions" (build_type=workflow).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build demo bundle
        run: bun run build:docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
